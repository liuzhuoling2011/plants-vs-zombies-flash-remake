<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>植物大战僵尸</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: #1a1208;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden; touch-action: none;
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
    }
    #wrap {
      width: min(100%, 960px);
      max-height: 100%;
      max-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
      padding: 6px;
      flex: 1 1 auto;
      min-height: 0;
    }
    h1 {
      color: #e8d48b; font-size: 15px; margin: 0; font-weight: 600; text-align: center;
      flex: 0 0 auto;
    }
    #game {
      background: #000;
      image-rendering: auto;
      box-shadow: 0 8px 32px #000a; border-radius: 4px;
      cursor: crosshair;
      flex: 0 1 auto;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100dvh - 72px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      aspect-ratio: 540 / 405;
      object-fit: contain;
      touch-action: none;
    }
    #loadshell {
      width: min(420px, 90vw);
      transition: opacity 0.35s ease;
      flex: 0 0 auto;
    }
    #loading { color: #ccc; font-size: 13px; text-align: center; margin: 0 0 6px; min-height: 1.2em; }
    #loadbar {
      height: 10px; background: #3a2a18; border-radius: 6px; overflow: hidden;
      border: 1px solid #5a4030;
    }
    #loadbar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #6b3, #ad5);
      transition: width 0.15s ease;
    }
    .hint {
      color: #a09070; font-size: 12px; text-align: center; max-width: 540px; line-height: 1.4;
      flex: 0 0 auto; margin: 0;
    }
    /* Phone landscape: maximize canvas, hide chrome, respect notches */
    @media (orientation: landscape) and (max-height: 520px) {
      h1, .hint { display: none; }
      #wrap {
        gap: 0;
        padding:
          max(2px, env(safe-area-inset-top, 0px))
          max(6px, env(safe-area-inset-right, 0px))
          max(2px, env(safe-area-inset-bottom, 0px))
          max(6px, env(safe-area-inset-left, 0px));
      }
      #game {
        max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 4px);
        max-width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px) - 8px);
        width: min(
          calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px) - 8px),
          calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 4px) * 540 / 405)
        );
        height: auto;
        border-radius: 2px;
      }
      #loadshell { max-width: 60vw; }
    }
    @media (orientation: landscape) and (max-height: 420px) {
      #loadshell #loading { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>植物大战僵尸</h1>
    <div id="loadshell">
      <div id="loading">正在连接资源…</div>
      <div id="loadbar"><div id="loadbar-fill"></div></div>
    </div>
    <canvas id="game" width="540" height="405"></canvas>
    <p class="hint">点卡片再点草地种植 · 再点同一卡片取消 · 右上暂停/加速 · 铲子可铲除<br/>Esc 回菜单 · 进度自动保存在本机</p>
  </div>
  <script type="module" src="js/game.js?v=hd4"></script>
</body>
</html>
